<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Backlog</title>
<link rel="stylesheet" href="{{.BasePath}}static/theme.css">
<link rel="stylesheet" href="{{.BasePath}}static/base.css">
<link rel="stylesheet" href="{{.BasePath}}static/deck.css">
<script src="{{.BasePath}}static/theme.js"></script>
<script src="{{.BasePath}}static/deck.js" defer></script>
</head>
<body data-deck="live" data-base="{{.BasePath}}" data-visit-key="deck.lastVisit.backlog">
<header class="top">
  <a href="/">Deck</a>
  <h1>Backlog</h1>
  <form class="filters" role="search" id="filters">
    <input type="search" id="f-text" placeholder="Search title, repository, status" aria-label="Search">
    <select id="f-project" aria-label="Repository"><option value="">All repositories</option></select>
    <select id="f-prefix" aria-label="Lane"><option value="">All lanes</option></select>
    <select id="f-sort" aria-label="Sort">
      <option value="">Default order</option>
      <option value="idle">Idle longest</option>
      <option value="updated">Recently updated</option>
    </select>
    <label class="check"><input type="checkbox" id="f-new"> New only</label>
  </form>
  <span data-deck-theme></span>
  <p class="notice" id="notice" hidden></p>
</header>
<main id="content">
{{template "backlog-content" .}}
</main>
</body>
</html>
