name: Merge update PRs
run-name: "Merge update PR queue (${{ forgejo.event_name }})"

on:
  schedule:
    # Retry throughout the validation window. Each run drains every update it
    # can and a later run catches PRs created after an earlier snapshot.
    - cron: "TZ=Europe/Oslo 30 4-7 * * *"
  workflow_dispatch:

jobs:
  auto-merge:
    name: Merge green update PRs
    runs-on: ubuntu-latest
    concurrency:
      group: package-update-auto-merge
      cancel-in-progress: false
    env:
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      FORGEJO_URL: https://git.alc.xyz
      FORGEJO_OWNER: alcxyz
      FORGEJO_REPO: nix-packages
      BASE_BRANCH: dev
      WAIT_FOR_STATUS_SECONDS: 1800
      WAIT_FOR_MERGEABLE_SECONDS: 300
      REQUIRED_STATUS_CONTEXTS: |
        Validate changes / Go tool tests (pull_request)
        Validate changes / Package build validation (pull_request)

    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 1
          github-server-url: https://git.alc.xyz
          ref: dev

      - name: Install runner prerequisites
        run: |
          apt-get update
          apt-get install -y jq

      - name: Test merge queue logic
        run: scripts/ci/test-auto-merge-update-prs.sh

      - name: Merge green package update PRs
        run: scripts/forgejo/auto-merge-update-prs.sh
