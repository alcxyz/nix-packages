name: Validate changes
run-name: "Validation (${{ forgejo.event_name }}): ${{ forgejo.head_ref || forgejo.ref_name }}"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  go-test:
    name: Go tool tests
    runs-on: forgejo-podman
    container:
      image: docker.io/library/node:20-bookworm
    steps:
      - name: Prepare action copy paths
        run: |
          # Podman's archive API rejects action paths through this absolute symlink.
          if [ -L /var/run ] && [ "$(readlink -f /var/run)" = /run ]; then
            rm /var/run
            mkdir -m 0755 /var/run
            if [ -d /run/act ]; then
              cp -a /run/act /var/run/act
            fi
            if [ -S /run/docker.sock ]; then
              ln -s /run/docker.sock /var/run/docker.sock
            fi
          fi

      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 1
          github-server-url: https://git.alc.xyz

      - name: Decide whether the tests apply
        # A pull request that changes nothing these tests read (the Go
        # modules, the nix-deploy contract test and this workflow) skips the
        # later steps; the job still succeeds under its name, which update
        # auto-merge requires. The diff compares the base and head commits
        # themselves, so changes that reached the base since the branch point
        # count too, and only add runs. Pushes, and any diff that cannot be
        # computed, run everything.
        id: scope
        env:
          EVENT: ${{ forgejo.event_name }}
          BASE_SHA: ${{ forgejo.event.pull_request.base.sha }}
          HEAD_SHA: ${{ forgejo.event.pull_request.head.sha }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ] &&
              git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"; then
              # Pathspecs instead of matching printed names: Git quotes
              # unusual file names, and --no-renames lists both sides of a
              # move, so a file moved out of tools/ or lib/ still counts.
              # Exit status 0 means no change there, 1 a change, anything
              # else an error, which runs the tests.
              status=0
              git diff --no-renames --quiet "$BASE_SHA" "$HEAD_SHA" -- \
                tools lib .forgejo/workflows/ci.yml || status=$?
              case "$status" in
                0) run=false ;;
                1) ;;
                *) echo "::warning::Cannot diff the pull request's base and head; running the tests." ;;
              esac
              echo "Changed between ${BASE_SHA} and ${HEAD_SHA}:"
              git -c core.quotePath=false diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" || true
            else
              echo "::warning::Cannot fetch the pull request's base and head; running the tests."
            fi
          fi
          echo "Go tool tests run: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: https://github.com/actions/setup-go@v5
        if: steps.scope.outputs.run == 'true'
        with:
          go-version-file: tools/devlog/go.mod
          # The runners serve no actions cache that job containers reach
          # (restore and save fail with ECONNREFUSED), so do not try.
          cache: false

      - name: Install workspace contract prerequisites
        if: steps.scope.outputs.run == 'true'
        run: |
          apt-get update
          apt-get install -y jq git ripgrep

      - name: Test Go tools
        if: steps.scope.outputs.run == 'true'
        run: |
          # Up to four modules test at once: most of their time is spent in
          # tests that wait, not in compiling. nix-deploy, the longest, starts
          # first and tests only under the race detector, since its switch
          # capture is shared by concurrent stream copies.
          logs="$(mktemp -d)"
          { echo tools/nix-deploy; find tools lib -maxdepth 2 -name go.mod -printf '%h\n' | grep -vx tools/nix-deploy | sort; } > "$logs/modules"
          xargs -P 4 -n 1 bash -c '
            log="$0/${1//\//_}"
            flags=()
            if [ "$1" = tools/nix-deploy ]; then flags=(-race); fi
            if go -C "$1" test -v "${flags[@]}" ./... > "$log.out" 2>&1; then echo ok > "$log.status"; else echo failed > "$log.status"; fi
          ' "$logs" < "$logs/modules"
          failed=()
          while IFS= read -r dir; do
            log="$logs/${dir//\//_}"
            echo "::group::go test $dir"
            cat "$log.out"
            echo "::endgroup::"
            if [ "$(cat "$log.status")" != ok ]; then failed+=("$dir"); fi
          done < "$logs/modules"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::go test failed in ${failed[*]}"
            exit 1
          fi

      - name: Test the nix-deploy contract
        if: steps.scope.outputs.run == 'true'
        run: |
          binary="$(mktemp -d)/deploy"
          go -C tools/nix-deploy build -o "$binary" .
          python3 tools/nix-deploy/test-deploy.py "$binary"

  nix-validation:
    # The shared runners run cheap checks only: tests, lint, and Nix evaluation
    # without builds. Native builds run locally on the development host, by the
    # author before pushing and by the local promoter before hosts follow a
    # revision (ADR-0003).
    name: Package validation prerequisites
    # Uses the host's shared read-only Nix store where the runner serves it
    # (nix-config ADR-0109, #1038; xyz for now). Other runners ignore the
    # mounts as invalid volumes, and the job installs Nix as before. Its
    # last step prints the paths it fetched to its own log, which the hosts'
    # fillers read once they have verified the run through the forge.
    runs-on: forgejo-podman
    container:
      image: docker.io/library/node:20-bookworm
      options: >-
        -v /run/forgejo-nix-cache/nix/store:/nix/store:O
        -v /run/forgejo-nix-cache/job:/nix-cache:ro
    steps:
      - name: Prepare action copy paths
        run: |
          # Podman's archive API rejects action paths through this absolute symlink.
          if [ -L /var/run ] && [ "$(readlink -f /var/run)" = /run ]; then
            rm /var/run
            mkdir -m 0755 /var/run
            if [ -d /run/act ]; then
              cp -a /run/act /var/run/act
            fi
            if [ -S /run/docker.sock ]; then
              ln -s /run/docker.sock /var/run/docker.sock
            fi
          fi

      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          github-server-url: https://git.alc.xyz

      - name: Install runner prerequisites
        run: |
          apt-get update
          apt-get install -y jq python3 sudo shellcheck gawk ripgrep

      - name: Test package update automation
        run: |
          scripts/ci/test-auto-merge-update-prs.sh
          scripts/ci/test-build-changed-packages.sh
          scripts/ci/test-ephemeral-nix-home.sh
          scripts/ci/test-t3code-nix-home.sh
          scripts/ci/test-verify-t3code-providers.sh
          scripts/ci/test-upsert-update-pr.sh
          scripts/ci/test-require-package-validation.sh
          scripts/ci/test-no-ci-builds.sh
          python3 scripts/ci/test-probe-ai-updates.py
          scripts/ci/test-ai-tools-updater.sh
          python3 scripts/ci/test-t3code-updater.py
          python3 scripts/ci/test-round1-updaters.py

      - name: Test Nix GC maintenance
        # The same script contract as checks.nix-gc-maintenance-contract, run
        # directly instead of building the check.
        run: |
          shellcheck tools/nix-gc-maintenance/nix-gc-maintenance.sh tools/nix-gc-maintenance/test
          bash tools/nix-gc-maintenance/test

      - name: Test the Kubernetes node network audit
        # The same script contract as checks.k8s-node-network-audit-contract.
        working-directory: tools/k8s-node-reboot
        run: |
          shellcheck scripts/ops/*.sh scripts/checks/*.sh
          bash scripts/checks/test-k8s-node-network-audit.sh

      - name: Validate package hashes
        run: scripts/ci/validate-package-hashes.sh

      - name: Use the host's Nix store
        # Cached paths come from the host's read-only store, new ones land in
        # this job's RAM scratch (nix-config ADR-0109). Without the store, or
        # for a fork's pull request, the next step installs Nix as before.
        id: nix-cache
        if: forgejo.event.pull_request.head.repo.fork != true
        run: |
          if [ -x /nix-cache/nix/bin/nix ] && [ -s /nix-cache/db/db.sqlite ]; then
            mkdir -p /nix/var/nix/db /etc/nix
            cp /nix-cache/db/db.sqlite /nix-cache/db/schema /nix/var/nix/db/
            printf '%s\n' 'build-users-group =' 'experimental-features = nix-command flakes' 'sandbox = false' > /etc/nix/nix.conf
            echo /nix-cache/nix/bin >> "$GITHUB_PATH"
            /nix-cache/nix/bin/nix path-info --all | sort > /tmp/nix-paths-before
            echo used=true >> "$GITHUB_OUTPUT"
          fi

      - uses: https://github.com/cachix/install-nix-action@v30
        if: steps.nix-cache.outputs.used != 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # Rootless Podman cannot mount a sandbox /proc; skip the failing attempt.
            sandbox = false

      - name: Fetch the T3 Code source that evaluation imports
        # T3 Code's preview browser pin is read from its source during
        # evaluation (import from derivation). Fetch that fixed-output source
        # through the fetch-only helper so the evaluation below builds nothing.
        run: |
          source scripts/update-packages/fod-hash.sh
          realise_fetch_only .#t3code.resourceMonitor.src

      - name: Evaluate all exported package platforms
        env:
          # No local builds: an evaluation that would build through import
          # from derivation fails instead (ADR-0003).
          NIX_CONFIG: max-jobs = 0
        run: scripts/ci/validate-package-platforms.sh

      - name: Evaluate the T3 Code provider contract
        env:
          NIX_CONFIG: max-jobs = 0
        run: scripts/ci/check-t3code-provider-versions.sh

      - name: Evaluate flake outputs without building
        env:
          NIX_CONFIG: max-jobs = 0
        run: nix flake check --no-build --all-systems

      - name: Offer the paths this run fetched
        if: always()
        run: |
          # Only printed: the hosts' fillers read these lines from this log
          # after verifying the run through the forge, and admit only signed
          # or pinned content (nix-config ADR-0109). Fork runs offer nothing.
          # Only paths cache.nixos.org signed, which leaves out the .drv
          # files and sources that evaluation writes locally.
          if [ -s /tmp/nix-paths-before ]; then
            nix path-info --all | sort | comm -13 /tmp/nix-paths-before -
          else
            nix path-info --all
          fi | grep -v '\.drv$' | xargs -r nix path-info --sigs |
            awk '/[[:space:]]cache\.nixos\.org-1:/ { print "nix-cache-offer " $1 }' || true

  package-build:
    # Keep this job's name: update auto-merge requires the
    # "Package build validation" status context.
    name: Package build validation
    if: always()
    needs:
      - go-test
      - nix-validation
    runs-on: forgejo-podman
    container:
      image: docker.io/library/node:20-bookworm
    steps:
      - name: Prepare action copy paths
        run: |
          # Podman's archive API rejects action paths through this absolute symlink.
          if [ -L /var/run ] && [ "$(readlink -f /var/run)" = /run ]; then
            rm /var/run
            mkdir -m 0755 /var/run
            if [ -d /run/act ]; then
              cp -a /run/act /var/run/act
            fi
            if [ -S /run/docker.sock ]; then
              ln -s /run/docker.sock /var/run/docker.sock
            fi
          fi

      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 1
          github-server-url: https://git.alc.xyz

      - name: Require every validation job
        env:
          GO_TEST_RESULT: ${{ needs.go-test.result }}
          PACKAGE_PREREQUISITES_RESULT: ${{ needs.nix-validation.result }}
        run: scripts/ci/require-package-validation.sh
