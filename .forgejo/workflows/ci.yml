name: Validate changes
run-name: "Validation (${{ forgejo.event_name }}): ${{ forgejo.head_ref || forgejo.ref_name }}"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  go-test:
    name: Go tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 1
          github-server-url: https://git.alc.xyz

      - uses: https://github.com/actions/setup-go@v5
        with:
          go-version-file: tools/devlog/go.mod

      - name: Test Go tools
        run: |
          while IFS= read -r mod; do
            dir="$(dirname "$mod")"
            echo "::group::go test ${dir}"
            (cd "$dir" && go test -v ./...)
            echo "::endgroup::"
          done < <(find tools -maxdepth 2 -name go.mod | sort)

  nix-validation:
    name: Package validation prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          github-server-url: https://git.alc.xyz

      - name: Install runner prerequisites
        run: |
          apt-get update
          apt-get install -y jq python3 sudo

      - name: Test package update automation
        run: |
          scripts/ci/test-auto-merge-update-prs.sh
          scripts/ci/test-build-changed-packages.sh
          scripts/ci/test-ephemeral-nix-home.sh
          scripts/ci/test-t3code-nix-home.sh
          scripts/ci/test-verify-t3code-providers.sh
          scripts/ci/test-nix-build-cache.sh
          scripts/ci/test-run-current-pr.sh
          scripts/ci/test-require-package-validation.sh
          scripts/ci/test-helium-updater.sh
          python3 scripts/ci/test-t3code-updater.py
          python3 tools/nix-deploy/test-deploy.py tools/nix-deploy/deploy

      - uses: https://github.com/cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate package hashes
        run: scripts/ci/validate-package-hashes.sh

      - name: Evaluate all exported package platforms
        run: scripts/ci/validate-package-platforms.sh

      - name: Test Nix GC maintenance
        run: nix build .#checks.x86_64-linux.nix-gc-maintenance-contract

      - name: Test Kubernetes node lifecycle helpers
        run: nix build .#checks.x86_64-linux.k8s-node-reboot-contract

  package-builds:
    name: Package builds and provider verification
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
    env:
      NIX_CI_CACHE_DIR: /tmp/nix-packages-cache
      CI_PULL_REQUEST_NUMBER: ${{ forgejo.event.pull_request.number }}
      CI_PULL_REQUEST_HEAD_SHA: ${{ forgejo.event.pull_request.head.sha }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          github-server-url: https://git.alc.xyz

      - name: Plan affected packages
        id: plan
        run: |
          PACKAGE_BUILD_PLAN_ONLY=1 PACKAGE_BUILD_PLAN_FILE=/tmp/package-plan \
            scripts/ci/build-changed-packages.sh
          full=false
          build=false
          cache=false
          if grep -Fqx '*' /tmp/package-plan; then
            full=true
            echo 'Complete export matrix selected; serialized shard jobs will build it.'
          elif test -s /tmp/package-plan; then
            build=true
            cat /tmp/package-plan
            while IFS= read -r attr; do
              case "$attr" in t3code|t3code-fork) cache=true ;; esac
            done < /tmp/package-plan
          else
            echo 'No package builds needed; validation prerequisites still run.'
          fi
          {
            echo "full=$full"
            echo "build=$build"
            echo "cache=$cache"
          } >> "$GITHUB_OUTPUT"

      - name: Install runner prerequisites
        if: steps.plan.outputs.build == 'true'
        run: |
          apt-get update
          apt-get install -y jq sudo zstd

      - uses: https://github.com/cachix/install-nix-action@v30
        if: steps.plan.outputs.build == 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore package dependency cache
        continue-on-error: true
        if: steps.plan.outputs.cache == 'true'
        id: cache
        uses: https://data.forgejo.org/actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/nix-packages-cache
          key: nix-packages-deps-v1-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('flake.nix', 'pkgs/**', 'tools/**') }}
          restore-keys: nix-packages-deps-v1-${{ runner.os }}-${{ hashFiles('flake.lock') }}-

      - name: Enable local build cache
        continue-on-error: true
        if: steps.plan.outputs.cache == 'true'
        run: scripts/ci/nix-build-cache.sh prepare

      - name: Build affected packages
        if: steps.plan.outputs.build == 'true'
        env:
          NIX_CI_EPHEMERAL_CONTAINER: "1"
        run: scripts/ci/run-current-pr.sh scripts/ci/build-changed-packages.sh

      - name: Verify T3 Code provider wiring
        if: steps.plan.outputs.build == 'true'
        env:
          NIX_CI_EPHEMERAL_CONTAINER: "1"
          T3CODE_CI_CLEAN_HOME: "true"
        run: scripts/ci/run-current-pr.sh scripts/ci/verify-t3code-providers.sh

      - name: Prepare bounded build cache
        continue-on-error: true
        if: steps.plan.outputs.cache == 'true' && steps.cache.outputs.cache-hit != 'true'
        id: export-cache
        run: scripts/ci/nix-build-cache.sh save

      - name: Save package dependency cache
        continue-on-error: true
        if: steps.export-cache.outputs.save == 'true'
        uses: https://data.forgejo.org/actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/nix-packages-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  package-builds-full-0:
    name: Full export builds, shard 0
    needs: package-builds
    if: needs.package-builds.outputs.full == 'true'
    runs-on: ubuntu-latest
    env:
      NIX_CI_CACHE_DIR: /tmp/nix-packages-cache
      CI_PULL_REQUEST_NUMBER: ${{ forgejo.event.pull_request.number }}
      CI_PULL_REQUEST_HEAD_SHA: ${{ forgejo.event.pull_request.head.sha }}
      PACKAGE_BUILD_SHARD_COUNT: "2"
      PACKAGE_BUILD_SHARD_INDEX: "0"
      PACKAGE_BUILD_SELECTED_FILE: /tmp/package-shard-selected
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          github-server-url: https://git.alc.xyz

      - name: Install runner prerequisites
        run: |
          apt-get update
          apt-get install -y jq sudo zstd

      - uses: https://github.com/cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore package dependency cache
        continue-on-error: true
        id: cache
        uses: https://data.forgejo.org/actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/nix-packages-cache
          key: nix-packages-deps-v1-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('flake.nix', 'pkgs/**', 'tools/**') }}-shard-0
          restore-keys: nix-packages-deps-v1-${{ runner.os }}-${{ hashFiles('flake.lock') }}-

      - name: Enable local build cache
        continue-on-error: true
        run: scripts/ci/nix-build-cache.sh prepare

      - name: Build full export shard
        env:
          NIX_CI_EPHEMERAL_CONTAINER: "1"
        run: scripts/ci/run-current-pr.sh scripts/ci/build-changed-packages.sh

      - name: Verify shard T3 Code provider wiring
        env:
          NIX_CI_EPHEMERAL_CONTAINER: "1"
          T3CODE_CI_CLEAN_HOME: "true"
        run: scripts/ci/run-current-pr.sh scripts/ci/verify-t3code-providers.sh

      - name: Prepare bounded build cache
        continue-on-error: true
        if: steps.cache.outputs.cache-hit != 'true'
        id: export-cache
        run: scripts/ci/nix-build-cache.sh save

      - name: Save package dependency cache
        continue-on-error: true
        if: steps.export-cache.outputs.save == 'true'
        uses: https://data.forgejo.org/actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/nix-packages-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  package-builds-full-1:
    name: Full export builds, shard 1
    needs:
      - package-builds
      - package-builds-full-0
    if: needs.package-builds.outputs.full == 'true'
    runs-on: ubuntu-latest
    env:
      NIX_CI_CACHE_DIR: /tmp/nix-packages-cache
      CI_PULL_REQUEST_NUMBER: ${{ forgejo.event.pull_request.number }}
      CI_PULL_REQUEST_HEAD_SHA: ${{ forgejo.event.pull_request.head.sha }}
      PACKAGE_BUILD_SHARD_COUNT: "2"
      PACKAGE_BUILD_SHARD_INDEX: "1"
      PACKAGE_BUILD_SELECTED_FILE: /tmp/package-shard-selected
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          github-server-url: https://git.alc.xyz

      - name: Install runner prerequisites
        run: |
          apt-get update
          apt-get install -y jq sudo zstd

      - uses: https://github.com/cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore package dependency cache
        continue-on-error: true
        id: cache
        uses: https://data.forgejo.org/actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/nix-packages-cache
          key: nix-packages-deps-v1-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('flake.nix', 'pkgs/**', 'tools/**') }}-shard-1
          restore-keys: nix-packages-deps-v1-${{ runner.os }}-${{ hashFiles('flake.lock') }}-

      - name: Enable local build cache
        continue-on-error: true
        run: scripts/ci/nix-build-cache.sh prepare

      - name: Build full export shard
        env:
          NIX_CI_EPHEMERAL_CONTAINER: "1"
        run: scripts/ci/run-current-pr.sh scripts/ci/build-changed-packages.sh

      - name: Verify shard T3 Code provider wiring
        env:
          NIX_CI_EPHEMERAL_CONTAINER: "1"
          T3CODE_CI_CLEAN_HOME: "true"
        run: scripts/ci/run-current-pr.sh scripts/ci/verify-t3code-providers.sh

      - name: Prepare bounded build cache
        continue-on-error: true
        if: steps.cache.outputs.cache-hit != 'true'
        id: export-cache
        run: scripts/ci/nix-build-cache.sh save

      - name: Save package dependency cache
        continue-on-error: true
        if: steps.export-cache.outputs.save == 'true'
        uses: https://data.forgejo.org/actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/nix-packages-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  package-build:
    name: Package build validation
    if: always()
    needs:
      - go-test
      - nix-validation
      - package-builds
      - package-builds-full-0
      - package-builds-full-1
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 1
          github-server-url: https://git.alc.xyz

      - name: Require every package validation job
        env:
          GO_TEST_RESULT: ${{ needs.go-test.result }}
          PACKAGE_PREREQUISITES_RESULT: ${{ needs.nix-validation.result }}
          PACKAGE_BUILDS_RESULT: ${{ needs.package-builds.result }}
          PACKAGE_FULL_MATRIX: ${{ needs.package-builds.outputs.full }}
          PACKAGE_FULL_SHARD_0_RESULT: ${{ needs.package-builds-full-0.result }}
          PACKAGE_FULL_SHARD_1_RESULT: ${{ needs.package-builds-full-1.result }}
        run: scripts/ci/require-package-validation.sh
